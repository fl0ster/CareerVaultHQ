[project]
name = "careervaulthq-backend"
version = "0.1.0"
description = "CareerVaultHQ REST API that also serves the React/Vite frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # File uploads (multipart/form-data)
    "python-multipart>=0.0.9",
    # Background jobs: Redis Queue is pure Python and light enough for a Raspberry Pi 2
    "redis>=5.0",
    "rq>=2.0",
]

[project.optional-dependencies]
dev = [
    # uvicorn extras (uvloop, httptools, watchfiles) have no armv7 wheels, so they are dev-only
    "uvicorn[standard]>=0.30",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "fakeredis>=2.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
