name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Platforms to build. linux/arm/v7 = Raspberry Pi 2; amd64/arm64 for workstations and newer Pis.
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

# Cancel in-progress runs for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # for provenance attestation
      attestations: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Versioning:
          #   git tag v1.2.3      -> 1.2.3, 1.2, 1, latest
          #   push to main        -> main, sha-<short>, edge
          #   pull request #42    -> pr-42 (built, never pushed)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=CareerVaultHQ
            org.opencontainers.image.description=CareerVaultHQ REST API + React frontend

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Prune old package versions
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write

    steps:
      # Multi-arch aware: never deletes per-platform manifests or attestations
      # that a kept tag still references.
      - name: Delete old untagged and sha-* image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Remove manifests not referenced by any tag (old digests, orphans)
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          # Of the non-excluded tags (i.e. sha-<short>), keep only the newest N
          keep-n-tagged: 3
          # Never touch release tags (1.2.3 / 1.2 / 1), latest, edge or main
          exclude-tags: '^\d+(\.\d+){0,2}$,latest,edge,main'
          use-regex: true
