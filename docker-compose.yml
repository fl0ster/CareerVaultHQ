# Run on the Raspberry Pi:  docker compose up -d
services:
  careervaulthq:

    # Published by .github/workflows/ci.yml. Override with IMAGE=... (e.g. a local build
    # or a pinned version such as ghcr.io/fl0ster/careervaulthq:1.2.3).
    image: ${IMAGE:-ghcr.io/fl0ster/careervaulthq:main}
    container_name: careervaulthq
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: CareerVaultHQ
      DEBUG: "false"
      CORS_ORIGINS: ""
      # SQLite file on the persistent /data volume (no separate DB container needed on the Pi).
      DATABASE_URL: sqlite:////data/careervault.db
      REDIS_URL: redis://redis:6379/0
      # Uploaded .tex files and generated PDFs; must be the same volume as the worker's.
      LATEX_ROOT: /data/latex
    volumes:
      - careervaulthq-data:/data
    depends_on:
      - redis
    networks:
      - careervaulthq-net

  # RQ worker: compiles LaTeX -> PDF jobs enqueued by the API (same image, same /data volume).
  worker-latex-2-pdf:
    image: ${IMAGE:-ghcr.io/fl0ster/careervaulthq:main}
    container_name: careervaulthq-worker-latex-2-pdf
    restart: unless-stopped
    command: ["python", "-m", "app.workers.latex2pdf"]
    environment:
      DEBUG: "false"
      DATABASE_URL: sqlite:////data/careervault.db
      REDIS_URL: redis://redis:6379/0
      LATEX_ROOT: /data/latex
      LATEX_TIMEOUT: "300"
    volumes:
      - careervaulthq-data:/data
    depends_on:
      - redis
    networks:
      - careervaulthq-net

  # RQ worker: compiles LaTeX -> PDF jobs enqueued by the API (same image, same /data volume).
  worker-scrapper:
    image: ${IMAGE:-ghcr.io/fl0ster/careervaulthq:main}
    container_name: careervaulthq-worker-scrapper
    restart: unless-stopped
    command: [ "python", "-m", "app.workers.scrapper" ]
    environment:
      DEBUG: "false"
      DATABASE_URL: sqlite:////data/careervault.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - careervaulthq-data:/data
    depends_on:
      - redis
    networks:
      - careervaulthq-net

  redis:
    image: redis:alpine
    container_name: careervaulthq-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - careervaulthq-net

  # Browser UI for inspecting the SQLite database on the Pi: http://<pi>:8080
  # Built locally on the Pi (upstream image is amd64-only). Read-only; mounts the
  # same /data volume as the API and workers.
  sqlite-web:
    build: ./tools/sqlite-web
    image: careervaulthq-sqlite-web
    container_name: careervaulthq-sqlite-web
    restart: unless-stopped
    command: ["--read-only", "/data/careervault.db"]
    ports:
      - "8080:8080"
    volumes:
      - careervaulthq-data:/data
    depends_on:
      - careervaulthq
    networks:
      - careervaulthq-net

  # Browser UI for inspecting Redis on the Pi: http://<pi>:8081
  # Built locally on the Pi (upstream Redis GUI images are amd64-only).
  redis-commander:
    build: ./tools/redis-commander
    image: careervaulthq-redis-commander
    container_name: careervaulthq-redis-commander
    restart: unless-stopped
    # REDIS_HOSTS is only understood by the upstream image's entrypoint script, so
    # the connection target is passed as CLI flags here.
    command: ["--redis-host", "redis", "--redis-port", "6379", "--redis-db", "0", "--address", "0.0.0.0"]
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - careervaulthq-net

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    environment:
      # Watchtower defaults to Docker API 1.25, which Docker Engine 29+ rejects.
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  careervaulthq-data:
  redis-data:

networks:
  careervaulthq-net:
    driver: bridge