# Run on the Raspberry Pi:  docker compose up -d
services:
  careervaulthq:

    # Published by .github/workflows/ci.yml. Override with IMAGE=... (e.g. a local build
    # or a pinned version such as ghcr.io/fl0ster/careervaulthq:1.2.3).
    image: ${IMAGE:-ghcr.io/fl0ster/careervaulthq:main}
    container_name: careervaulthq
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: CareerVaultHQ
      DEBUG: "false"
      CORS_ORIGINS: ""
      # SQLite file on the persistent /data volume (no separate DB container needed on the Pi).
      DATABASE_URL: sqlite:////data/careervault.db
      REDIS_URL: redis://redis:6379/0
      # Uploaded .tex files and generated PDFs; must be the same volume as the worker's.
      LATEX_ROOT: /data/latex
      # Generated CVs (app.tasks.cv); same volume as the worker's.
      CV_ROOT: /data/cv
      # Uploaded CV PDFs for import (app.tasks.cv_import); same volume as the worker's.
      CV_IMPORT_UPLOAD_ROOT: /data/cv_import
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Optional per-call LLM model overrides (defaults live in app/llm_calls.py). To use:
      #   docker compose exec careervaulthq cp llm_models.example.toml /data/llm_models.toml
      # edit it on the volume, then: docker compose restart careervaulthq worker
      OPENROUTER_MODELS_FILE: /data/llm_models.toml
    volumes:
      - careervaulthq-data:/data
    depends_on:
      - redis
    networks:
      - careervaulthq-net

  # RQ worker: runs every background job enqueued by the API (LaTeX -> PDF compiles,
  # web scraping and parsing) from one queue. Same image, same /data volume.
  worker:
    image: ${IMAGE:-ghcr.io/fl0ster/careervaulthq:main}
    container_name: careervaulthq-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    environment:
      DEBUG: "false"
      DATABASE_URL: sqlite:////data/careervault.db
      REDIS_URL: redis://redis:6379/0
      LATEX_ROOT: /data/latex
      LATEX_TIMEOUT: "300"
      CV_ROOT: /data/cv
      CV_IMPORT_UPLOAD_ROOT: /data/cv_import
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Same model overrides as the API (see above).
      OPENROUTER_MODELS_FILE: /data/llm_models.toml
    volumes:
      - careervaulthq-data:/data
    depends_on:
      - redis
    networks:
      - careervaulthq-net

  # Scheduler: enqueues periodic jobs (catch-up evaluation, cleanup, scrapes) on the
  # worker's queue. The scrape scheduler reads/writes scrape_sources, so it needs the
  # same SQLite database on the /data volume (but no API key).
  scheduler:
    image: ${IMAGE:-ghcr.io/fl0ster/careervaulthq:main}
    container_name: careervaulthq-scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler.scheduler"]
    environment:
      DEBUG: "false"
      DATABASE_URL: sqlite:////data/careervault.db
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_SLEEP_SECONDS: 30
    volumes:
      - careervaulthq-data:/data
    depends_on:
      - redis
      - worker
    # Must share the network with redis, otherwise the "redis" hostname does not resolve.
    networks:
      - careervaulthq-net

  redis:
    image: redis:alpine
    container_name: careervaulthq-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - careervaulthq-net

  # Browser UI for inspecting the SQLite database on the Pi: http://<pi>:8080
  # Built locally on the Pi (upstream image is amd64-only). Read-only; mounts the
  # same /data volume as the API and workers.
  sqlite-web:
    build: ./tools/sqlite-web
    image: careervaulthq-sqlite-web
    container_name: careervaulthq-sqlite-web
    restart: unless-stopped
    command: ["--read-only", "/data/careervault.db"]
    ports:
      - "8080:8080"
    volumes:
      - careervaulthq-data:/data
    depends_on:
      - careervaulthq
    networks:
      - careervaulthq-net

  # Browser UI for inspecting Redis on the Pi: http://<pi>:8081
  # Built locally on the Pi (upstream Redis GUI images are amd64-only).
  redis-commander:
    build: ./tools/redis-commander
    image: careervaulthq-redis-commander
    container_name: careervaulthq-redis-commander
    restart: unless-stopped
    # REDIS_HOSTS is only understood by the upstream image's entrypoint script, so
    # the connection target is passed as CLI flags here.
    command: ["--redis-host", "redis", "--redis-port", "6379", "--redis-db", "0", "--address", "0.0.0.0"]
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - careervaulthq-net

volumes:
  careervaulthq-data:
  redis-data:

networks:
  careervaulthq-net:
    driver: bridge